 {id:"alm03",y:2003,lane:0,t:3,lbl:"ALM 03",authors:"David H. Autor, Frank Levy, Richard J. Murnane",title:"The Skill Content of Recent Technological Change: An Empirical Exploration",venue:"Quarterly Journal of Economics, 118(4)",yr:"2003",
  abs:"컴퓨터는 '직업'이 아니라 '과업(task)'을 대체한다는 프레임을 제시한다. 규칙으로 기술할 수 있는 정형(routine) 과업은 컴퓨터가 대체하고, 문제 해결·복잡한 소통 같은 비정형 과업은 오히려 보완된다는 것을 미국 직업 데이터로 보였다. 이후 자동화·AI 연구 전체가 이 과업 모형 위에서 전개된다."},

 {id:"fo13",y:2013,lane:3,t:3,lbl:"Frey·Osborne 13",authors:"Carl Benedikt Frey, Michael A. Osborne",title:"The Future of Employment: How Susceptible Are Jobs to Computerisation?",venue:"옥스퍼드 WP 2013 → Technological Forecasting and Social Change 114 (2017)",yr:"2013/2017",

 {id:"bm14",y:2014,lane:1,t:3,lbl:"제2의 기계시대 14",authors:"Erik Brynjolfsson, Andrew McAfee",title:"The Second Machine Age: Work, Progress, and Prosperity in a Time of Brilliant Technologies",venue:"W. W. Norton (단행본)",yr:"2014",
  abs:"디지털 기술이 증기기관에 비견되는 범용 기술이며, 그 혜택과 노동시장 충격이 비대칭적으로 분배되는 '대분기(great decoupling)'를 대중적으로 정식화했다. 기술 낙관과 분배 비관을 동시에 담아 이후 정책 논쟁의 기본서가 되었다."},
 {id:"autor15",y:2015,lane:0,t:3,lbl:"Autor 15",authors:"David H. Autor",title:"Why Are There Still So Many Jobs? The History and Future of Workplace Automation",venue:"Journal of Economic Perspectives, 29(3)",yr:"2015",

 {id:"bmit17",y:2017,lane:3,t:2,lbl:"Brynjolfsson·Mitchell 17",authors:"Erik Brynjolfsson, Tom Mitchell",title:"What Can Machine Learning Do? Workforce Implications",venue:"Science, 358(6370)",yr:"2017",

 {id:"ar18",y:2018,lane:1,t:2,lbl:"A&R 18",authors:"Daron Acemoglu, Pascual Restrepo",title:"The Race between Man and Machine: Implications of Technology for Growth, Factor Shares, and Employment",venue:"American Economic Review, 108(6)",yr:"2018",

 {id:"gm18",y:2018,lane:2,t:2,lbl:"Graetz·Michaels 18",authors:"Georg Graetz, Guy Michaels",title:"Robots at Work",venue:"Review of Economics and Statistics, 100(5)",yr:"2018",

 {id:"ar19",y:2019,lane:1,t:2,lbl:"A&R 19",authors:"Daron Acemoglu, Pascual Restrepo",title:"Automation and New Tasks: How Technology Displaces and Reinstates Labor",venue:"Journal of Economic Perspectives, 33(2)",yr:"2019",

 {id:"webb20",y:2020,lane:3,t:1,lbl:"Webb 20",authors:"Michael Webb",title:"The Impact of Artificial Intelligence on the Labor Market",venue:"스탠퍼드 WP (SSRN)",yr:"2020",
  abs:"AI 특허 문서와 직업별 직무 기술서의 텍스트를 매칭해 직업별 AI 노출도를 측정하는 방법을 제시했다. 소프트웨어·로봇과 달리 AI는 고학력·고임금 직업에 더 많이 노출된다는 결과로, 이후 각국 중앙은행·연구기관 노출 지수의 원형이 되었다."},
 {id:"ar20",y:2020,lane:2,t:2,lbl:"A&R 로봇 20",authors:"Daron Acemoglu, Pascual Restrepo",title:"Robots and Jobs: Evidence from US Labor Markets",venue:"Journal of Political Economy, 128(6)",yr:"2020",
  abs:"미국 지역 노동시장 데이터로 산업용 로봇 1대 추가가 고용과 임금에 미치는 인과 효과를 추정했다. 로봇 밀도가 높아진 지역에서 고용률과 임금이 유의하게 하락 — 자동화의 대체효과를 가장 설득력 있게 실증한 대표작."},
 {id:"felten21",y:2021,lane:3,t:1,lbl:"Felten 21",authors:"Edward Felten, Manav Raj, Robert Seamans",title:"Occupational, Industry, and Geographic Exposure to Artificial Intelligence (AIOE)",venue:"Strategic Management Journal, 42(12)",yr:"2021",

 {id:"dauth21",y:2021,lane:2,t:1,lbl:"Dauth 21",authors:"Wolfgang Dauth, Sebastian Findeisen, Jens Südekum, Nicole Wößner",title:"The Adjustment of Labor Markets to Robots",venue:"Journal of the European Economic Association, 19(6)",yr:"2021",

 {id:"elou23",y:2023,lane:3,t:2,lbl:"GPTs are GPTs 23",authors:"Tyna Eloundou, Sam Manning, Pamela Mishkin, Daniel Rock",title:"GPTs are GPTs: An Early Look at the Labor Market Impact Potential of Large Language Models",venue:"WP 2023 → Science 384(6702) (2024)",yr:"2023/2024",

 {id:"noy23",y:2023,lane:4,t:2,lbl:"Noy·Zhang 23",authors:"Shakked Noy, Whitney Zhang",title:"Experimental Evidence on the Productivity Effects of Generative Artificial Intelligence",venue:"Science, 381(6654)",yr:"2023",

 {id:"peng23",y:2023,lane:4,t:1,lbl:"Copilot 23",authors:"Sida Peng, Eirini Kalliamvakou, Peter Cihon, Mert Demirer",title:"The Impact of AI on Developer Productivity: Evidence from GitHub Copilot",venue:"WP (arXiv)",yr:"2023",

 {id:"dell23",y:2023,lane:4,t:2,lbl:"BCG 실험 23",authors:"Fabrizio Dell'Acqua, Edward McFowland III, Ethan Mollick 외",title:"Navigating the Jagged Technological Frontier: Field Experimental Evidence of the Effects of AI on Knowledge Worker Productivity and Quality",venue:"Harvard Business School WP 24-013",yr:"2023",

 {id:"acem24",y:2024,lane:1,t:1,lbl:"Acemoglu 24",authors:"Daron Acemoglu",title:"The Simple Macroeconomics of AI",venue:"Economic Policy, 39(120)",yr:"2024",

 ["aa11","alm03"],["fo13","alm03"],["autor15","alm03"],["ar18","alm03"],["webb20","alm03"],
 ["fo13","aa11"],["ar18","aa11"],["elou23","alm03"],
 ["autor15","fo13"],["ar18","fo13"],["webb20","fo13"],["felten21","fo13"],["elou23","fo13"],["gm18","fo13"],
 ["ar18","bm14"],["autor15","bm14"],
 ["ar19","autor15"],["acem24","autor15"],["autor24","autor15"],
 ["ar19","ar18"],["ar20","ar18"],["acem24","ar18"],["agh19","ar18"],
 ["ar20","gm18"],["dauth21","gm18"],["dauth21","ar20"],
 ["bmit17","alm03"],["webb20","bmit17"],["felten21","bmit17"],["elou23","bmit17"],
 ["elou23","webb20"],["felten21","webb20"],["acem24","webb20"],
 ["elou23","felten21"],["canary25","elou23"],["acem24","elou23"],["huml25","elou23"],
 ["blr25","noy23"],["dell23","noy23"],["canary25","noy23"],["huml25","noy23"],["acem24","noy23"],
 ["canary25","blr25"],["huml25","blr25"],["canary25","peng23"],["huml25","dell23"],
 ["canary25","autor24"],["acem24","ar19"]
];

/* ===== 렌더 (세로 시간축) ===== */
document.getElementById("legend").innerHTML =
  LANES.map(l=>`<span class="chip"><i class="sw" style="background:${l.color}"></i>${l.name}</span>`).join("")
  + `<span class="chip">● 크기 = 인용 규모(대략)</span>`;
const W=780, H=1150, padT=64, padB=26, padL=64, padR=12;
const y0=2002, y1=2027;
const py = yr => padT + (yr-y0)/(y1-y0)*(H-padT-padB);
const colW = (W-padL-padR)/LANES.length;
const laneX = i => padL + (i+0.5)*colW;
const R = {1:8, 2:11, 3:14.5};
const ns="http://www.w3.org/2000/svg";
const svg=document.createElementNS(ns,"svg");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
const el=(t,a,txt)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e;};
/* 레인 컬럼 */
LANES.forEach((l,i)=>{
  el("rect",{x:padL+i*colW,y:padT,width:colW,height:H-padT-padB,fill:i%2?"#fafcf9":"#ffffff"});
  el("text",{x:laneX(i),y:30,"text-anchor":"middle","font-size":13,"font-weight":900,fill:l.color},l.name);
  el("text",{x:laneX(i),y:47,"text-anchor":"middle","font-size":10,fill:"#898781"},["과업 모형","대체 vs 신과업","로봇·데이터 인과","누가 노출되나","실험과 실측"][i]);
});
/* 연도 눈금 (가로선) */
[2005,2010,2015,2020,2025].forEach(yr=>{
  el("line",{x1:padL,y1:py(yr),x2:W-padR,y2:py(yr),stroke:"#e1e0d9","stroke-width":1});
  el("text",{x:padL-8,y:py(yr)+4,"text-anchor":"end","font-size":12,"font-weight":700,fill:"#898781"},yr);
});
/* 알파고 쇼크 */
el("line",{x1:padL,y1:py(2016),x2:W-padR,y2:py(2016),stroke:"#b0483f","stroke-width":1.5,"stroke-dasharray":"6 4"});
el("text",{x:W-padR-4,y:py(2016)-6,"text-anchor":"end","font-size":11,"font-weight":800,fill:"#b0483f"},"알파고 쇼크 (2016)");
/* 좌표 + 겹침 조정 (같은 레인 안에서 x를 좌우로) */
const pos={};
P.forEach(p=>{ pos[p.id]={x:laneX(p.lane), y:py(p.y)}; });
const dx={alm03:0,aa11:0,autor15:-28,autor24:22,bm14:0,ar18:-26,ar19:26,agh19:-34,acem24:20,
 gm18:-26,ar20:24,dauth21:-20,fo13:0,bmit17:26,webb20:-30,felten21:30,elou23:0,
 noy23:-34,peng23:30,dell23:-30,blr25:28,canary25:-24,huml25:26};
for(const id in dx){ if(pos[id]) pos[id].x += dx[id]; }
pos["autor15"].y -= 4; pos["ar19"].y += 6; pos["felten21"].y += 4; pos["dell23"].y += 14; pos["peng23"].y += 12;
/* 엣지 */
const edgeEls=[];
E.forEach(([to,from])=>{
  const a=pos[from], b=pos[to];
  if(!a||!b) return;
  const my=(a.y+b.y)/2;
  const path=el("path",{d:`M${a.x},${a.y} C${a.x},${my} ${b.x},${my} ${b.x},${b.y}`,fill:"none",stroke:"#b9c3bd","stroke-width":1.2,opacity:.45});
  edgeEls.push({path,from,to});
});
/* 노드 + 라벨 */
const panel=document.getElementById("panel");
let selEl=null;
function citesOf(id){ return E.filter(e=>e[0]===id).map(e=>e[1]); }
function citedBy(id){ return E.filter(e=>e[1]===id).map(e=>e[0]); }
const byId=Object.fromEntries(P.map(p=>[p.id,p]));
function showPanel(p){
  const l=LANES[p.lane];
  const anc=citesOf(p.id).map(i=>byId[i].lbl).join(", ")||"—";
  const desc=citedBy(p.id).map(i=>byId[i].lbl).join(", ")||"—";
  panel.innerHTML=`
    <span class="p-lane" style="background:${l.color}">${l.name}</span>
    <div class="p-title">${p.title}</div>
    <div class="p-meta"><b>${p.authors}</b><br/>${p.venue} · ${p.yr} · 인용 규모 ${"●".repeat(p.t)}${"○".repeat(3-p.t)}</div>
    <div class="p-h">초록 (요약)</div>
    <div class="p-abs">${p.abs}</div>
    <div class="p-h">계보에서의 위치</div>
    <div class="p-cites"><b>이 논문이 인용하는 논문</b> — ${anc}<br/><b>이 논문을 인용한 논문</b> — ${desc}</div>
    <div class="p-note">초록은 원문을 한국어로 요약한 것이며, 인용 관계는 이 계보도에 포함된 23편 사이의 대표 경로만 표시합니다.</div>`;
}
P.forEach(p=>{
  const {x,y}=pos[p.id];
  const c=el("circle",{cx:x,cy:y,r:R[p.t],fill:LANES[p.lane].color,stroke:"#fff","stroke-width":1.8,opacity:.95,"class":"node"});
  const t=el("text",{x:x,y:y-R[p.t]-5,"text-anchor":"middle","font-size":10,"font-weight":800,fill:"#52514e","paint-order":"stroke",stroke:"#ffffff","stroke-width":3,"pointer-events":"none"},p.lbl);
  const hi=on=>{
    edgeEls.forEach(o=>{
      const hit=o.from===p.id||o.to===p.id;
      o.path.setAttribute("stroke",on&&hit?"#375f8f":"#b9c3bd");
      o.path.setAttribute("stroke-width",on&&hit?2.2:1.2);
      o.path.setAttribute("opacity",on?(hit?.9:.1):.45);
    });
  };
  c.addEventListener("mouseenter",()=>hi(true));
  c.addEventListener("mouseleave",()=>{ if(selEl!==c) hi(false); });
  c.addEventListener("click",()=>{
    if(selEl) selEl.classList.remove("sel");
    selEl=c; c.classList.add("sel");
    hi(true);
    showPanel(p);
  });
});
document.getElementById("chart").appendChild(svg);
</script>
</body>
</html>
